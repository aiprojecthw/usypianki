# Wydanie do Google Play (AAB) budowane na GitHubie — uruchamiane ręcznie:
#   GitHub → Actions → „Android – AAB do Google Play” → Run workflow.
# Wynik: plik usypianki-<wersja>.aab w zakładce Releases (wydanie „play-<numer>”).
#
# Podpis kluczem przesyłania z sekretów repozytorium:
#   UPLOAD_KEYSTORE_BASE64, UPLOAD_STORE_PASSWORD, UPLOAD_KEY_ALIAS, UPLOAD_KEY_PASSWORD
# versionCode = 100 + numer uruchomienia (każde wgranie do Google Play musi mieć wyższy).
name: Android – AAB do Google Play

on:
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: android-aab
  cancel-in-progress: false

jobs:
  aab:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Numer versionCode
        run: echo "VERSION_CODE=$((100 + GITHUB_RUN_NUMBER))" >> "$GITHUB_ENV"

      - name: Sprawdzenie sekretów podpisu
        env:
          KS: ${{ secrets.UPLOAD_KEYSTORE_BASE64 }}
          SP: ${{ secrets.UPLOAD_STORE_PASSWORD }}
          KA: ${{ secrets.UPLOAD_KEY_ALIAS }}
          KP: ${{ secrets.UPLOAD_KEY_PASSWORD }}
        run: |
          for v in KS SP KA KP; do
            if [ -z "${!v}" ]; then echo "::error::Brak sekretu podpisu ($v). Ustaw sekrety UPLOAD_* w Settings → Secrets and variables → Actions."; exit 1; fi
          done

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Instalacja zależności
        run: npm ci

      - name: Testy jednostkowe
        run: npm test -- --ci

      - name: Sprawdzenie typów
        run: npx tsc --noEmit

      - name: Numer wersji dla Google Play
        run: |
          node -e "
            const fs = require('fs');
            const app = JSON.parse(fs.readFileSync('app.json', 'utf8'));
            app.expo.android.versionCode = Number(process.env.VERSION_CODE);
            fs.writeFileSync('app.json', JSON.stringify(app, null, 2) + '\n');
            console.log('versionName', app.expo.version, 'versionCode', app.expo.android.versionCode);
          "

      - name: Generowanie projektu Android
        run: npx expo prebuild --platform android --no-install --clean

      - name: Klucz przesyłania
        env:
          KS: ${{ secrets.UPLOAD_KEYSTORE_BASE64 }}
        run: |
          echo "$KS" | base64 -d > "$RUNNER_TEMP/upload.p12"
          echo "UPLOAD_STORE_FILE=$RUNNER_TEMP/upload.p12" >> "$GITHUB_ENV"

      - name: Budowanie AAB
        working-directory: android
        env:
          UPLOAD_STORE_PASSWORD: ${{ secrets.UPLOAD_STORE_PASSWORD }}
          UPLOAD_KEY_ALIAS: ${{ secrets.UPLOAD_KEY_ALIAS }}
          UPLOAD_KEY_PASSWORD: ${{ secrets.UPLOAD_KEY_PASSWORD }}
        run: ./gradlew bundleRelease --no-daemon

      - name: Sprawdzenie podpisu
        run: |
          AAB=android/app/build/outputs/bundle/release/app-release.aab
          jarsigner -verify -certs "$AAB" | grep -q "jar verified" || { echo "::error::AAB nie jest podpisany"; exit 1; }
          if jarsigner -verify -verbose -certs "$AAB" | grep -q "CN=Android Debug"; then
            echo "::error::AAB podpisany kluczem debug zamiast kluczem przesyłania"; exit 1
          fi

      - name: Publikacja pliku AAB
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(node -p "require('./app.json').expo.version")
          NAME="usypianki-${VERSION}-${VERSION_CODE}.aab"
          cp android/app/build/outputs/bundle/release/app-release.aab "$NAME"
          gh release create "play-${VERSION_CODE}" "$NAME" \
            --target "${{ github.sha }}" \
            --title "Usypianki ${VERSION} (${VERSION_CODE}) – plik do Google Play" \
            --notes "Plik AAB do wgrania w Play Console (test wewnętrzny / zamknięty). versionCode ${VERSION_CODE}. Commit: ${{ github.sha }}" \
            --latest=false

      - name: Sprzątanie klucza
        if: always()
        run: rm -f "$RUNNER_TEMP/upload.p12"
